name: Android CI

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build All Modules & Companion APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode KeyStore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.jks

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        env:
          KEYSTORE_FILE: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android, aarch64-linux-android

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gateway -> target

      - name: Run Gateway Unit Tests
        run: cargo test -p rclone-gateway

      - name: Setup Android NDK
        run: |
          if [ -n "$ANDROID_NDK_LATEST_HOME" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            NDK_PATH="$ANDROID_NDK_LATEST_HOME"
          elif [ -d "$ANDROID_HOME/ndk" ]; then
            NDK_PATH=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          else
            echo "Installing NDK via sdkmanager..."
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.3.11579264"
            NDK_PATH="$ANDROID_HOME/ndk/26.3.11579264"
          fi
          echo "Using Android NDK at: $NDK_PATH"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_LATEST_HOME=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Build and Extract rclone-fuse3-magisk Binaries
        run: |
          pip install meson ninja
          cd external/rclone-fuse3-magisk
          chmod +x patch.sh build.sh scripts/*.sh
          ./patch.sh
          echo "=== Building arm64-v8a in submodule ==="
          ./build.sh arm64-v8a
          echo "=== Building x86_64 in submodule ==="
          ./build.sh x86_64
          cd ../..
          mkdir -p magisk-module/prebuilt/arm64-v8a magisk-module/prebuilt/x86_64
          cp external/rclone-fuse3-magisk/magisk-rclone_arm64-v8a/system/vendor/bin/rclone magisk-module/prebuilt/arm64-v8a/
          cp external/rclone-fuse3-magisk/magisk-rclone_arm64-v8a/system/vendor/bin/fusermount3 magisk-module/prebuilt/arm64-v8a/
          cp external/rclone-fuse3-magisk/magisk-rclone_x86_64/system/vendor/bin/rclone magisk-module/prebuilt/x86_64/
          cp external/rclone-fuse3-magisk/magisk-rclone_x86_64/system/vendor/bin/fusermount3 magisk-module/prebuilt/x86_64/
          chmod +x magisk-module/prebuilt/*/*

      - name: Build Magisk Modules (x86_64 and arm64)
        run: |
          chmod +x scripts/build-module.sh
          echo "=== Building x86_64 Module ==="
          TARGET=x86_64-linux-android ./scripts/build-module.sh
          echo "=== Building arm64 Module ==="
          TARGET=aarch64-linux-android ./scripts/build-module.sh

      - name: Verify ZIP structure
        run: |
          echo "=== Verifying x86_64 ZIP ==="
          unzip -l dist/rclone-manager-x86_64.zip
          echo "=== Verifying arm64 ZIP ==="
          unzip -l dist/rclone-manager-arm64.zip

          # Ensure no leading dot directory exists in zip
          if unzip -l dist/rclone-manager-x86_64.zip | grep -E '^\s+[0-9]+\s+[0-9-]+\s+[0-9:]+\s+\./?$'; then
            echo "❌ Error: Found leading dot directory in x86_64 zip!"
            exit 1
          fi
          if unzip -l dist/rclone-manager-arm64.zip | grep -E '^\s+[0-9]+\s+[0-9-]+\s+[0-9:]+\s+\./?$'; then
            echo "❌ Error: Found leading dot directory in arm64 zip!"
            exit 1
          fi
          echo "✅ All zip structures verified without leading dot."

      - name: Rename Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          # Rename debug APK
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/RcloneManager-${TAG_NAME}-debug.apk
          # Rename release APK (check if signed version exists, otherwise fallback to unsigned)
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/RcloneManager-${TAG_NAME}-release.apk
          elif [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/RcloneManager-${TAG_NAME}-release-unsigned.apk
          fi
          # Copy modules with tagged names
          cp dist/rclone-manager-x86_64.zip dist/rclone-manager-${TAG_NAME}-x86_64.zip
          cp dist/rclone-manager-arm64.zip dist/rclone-manager-${TAG_NAME}-arm64.zip

      - name: Cleanup KeyStore
        if: always()
        run: rm -f app/release.jks

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Magisk Modules
        uses: actions/upload-artifact@v4
        with:
          name: rclone-magisk-modules
          path: dist/*.zip
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/RcloneManager-*-debug.apk
            app/build/outputs/apk/release/RcloneManager-*-release*.apk
            dist/rclone-manager-*-x86_64.zip
            dist/rclone-manager-*-arm64.zip
            dist/rclone-manager-x86_64.zip
            dist/rclone-manager-arm64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
